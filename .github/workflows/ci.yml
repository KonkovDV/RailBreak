name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: plant / checker
        run: python tools/eval/test_eval.py
      - name: generator
        run: python tools/synth/test_generate.py
      - name: no GNSS in filter
        run: python tools/eval/no_gnss_scan.py

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cmake standalone core
        run: |
          cmake -S standalone -B standalone/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"
          cmake --build standalone/build --parallel
          ctest --test-dir standalone/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: synth e2e (generate -> replay_ukf -> envelope -> score)
        run: |
          python tools/synth/generate.py --out synth/runs
          python tools/eval/run_e2e.py --ukf standalone/build/replay_ukf
          python tools/synth/score.py --runs synth/runs

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # F-11: this job used to build test_core only, so the integrity
      # contracts and the UT weight algebra never ran under sanitizers.
      # The target list below is explicit, which means every new test target
      # must be added here as well - the Release job above picks new targets
      # up through ctest, this one does not.
      - name: sanitizers on all core test targets
        run: |
          cmake -S standalone -B standalone/build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build standalone/build-asan \
            --target test_core test_integrity_contracts test_ut_weights_psd \
                     test_ut_weights_header \
            --parallel
          export ASAN_OPTIONS=detect_leaks=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          ./standalone/build-asan/test_core
          ./standalone/build-asan/test_integrity_contracts
          ./standalone/build-asan/test_ut_weights_psd
          ./standalone/build-asan/test_ut_weights_header

  ros:
    # F-19: every job above builds standalone/ only. No ROS node in
    # tram_dr_localization is compiled by CI and none of the four
    # ament_add_gtest suites ever runs. The node layer is where all
    # input-validation and timebase handling lives, so the entire class of
    # defect that F-17 / F-17b belong to is invisible to CI by construction.
    #
    # STATUS: informational, NOT gating. This job does not yet pass. It fails
    # during environment setup, before colcon is reached, and the cause has not
    # been identified - two hypotheses (a missing `apt-get update`, then the
    # ROS apt signing key) were both tested and both wrong. Until someone with
    # access to the run log finishes the diagnosis, `continue-on-error` keeps a
    # job of unknown health from blocking review, because a permanently red
    # check that nobody can explain trains reviewers to ignore CI entirely -
    # which is how the node layer went uncompiled in the first place.
    #
    # Therefore F-19 is still OPEN. Do not read the presence of this job as
    # coverage; read it as a placeholder that announces the missing coverage.
    # Remove `continue-on-error` in the same commit that makes it green.
    #
    # Distro matches the Dockerfile (osrf/ros:humble-desktop).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: ros:humble-ros-base
    steps:
      - name: container diagnostics
        shell: bash
        run: |
          # Deliberately tolerant: this step exists to make the NEXT run
          # diagnosable from the summary alone, so it must never be the thing
          # that fails.
          set +e
          {
            echo "### ros job container diagnostics"
            echo
            echo '```'
            echo "ROS_DISTRO = ${ROS_DISTRO:-<unset>}"
            echo "whoami     = $(whoami 2>&1)"
            echo "pwd        = $(pwd 2>&1)"
            echo "workspace  = ${GITHUB_WORKSPACE:-<unset>}"
            for tool in git c++ cmake colcon rosdep python3; do
              printf '%-8s -> %s\n' "$tool" "$(command -v "$tool" 2>&1 || echo MISSING)"
            done
            echo
            echo "-- os-release --"
            cat /etc/os-release 2>&1 | head -4
            echo
            echo "-- ros setup --"
            ls -la "/opt/ros/${ROS_DISTRO:-humble}/setup.bash" 2>&1
            echo
            echo "-- rosdep sources --"
            ls -la /etc/ros/rosdep/sources.list.d/ 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          exit 0
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: workspace and dependencies
        shell: bash
        run: |
          set -uxo pipefail
          # Deliberately no apt-get. ros:humble-ros-base already ships
          # build-essential, python3-colcon-common-extensions and
          # python3-rosdep, and its own Dockerfile has already run
          # `rosdep init`. Calling `apt-get update` would tie this package's
          # build to the ROS apt repository's signing key staying valid - an
          # unrelated external dependency that reports itself as a failure of
          # code it never compiled.
          mkdir -p /ws/src
          # Same layout the Dockerfile uses, so this job validates that too.
          cp -a "$GITHUB_WORKSPACE/tram_dr_localization" /ws/src/ || true
          # rosdep is best-effort. This package depends only on rclcpp,
          # std_msgs, sensor_msgs, nav_msgs and ament_cmake_gtest, all present
          # in the base image, so an unreachable rosdep index must not be
          # reported as a compile failure. The colcon build below is the
          # authoritative check.
          rosdep update --rosdistro "$ROS_DISTRO" \
            || echo "rosdep update unavailable, continuing on base image contents"
          rosdep install --from-paths /ws/src --ignore-src -y --rosdistro "$ROS_DISTRO" \
            || echo "rosdep install incomplete, continuing on base image contents"
          exit 0
      - name: colcon build (core library + all four nodes)
        shell: bash
        run: |
          set -euxo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cd /ws
          colcon build --packages-select tram_dr_localization \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"
      - name: colcon test (test_types, test_plant, test_sca, test_ukf)
        shell: bash
        run: |
          set -euxo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cd /ws
          colcon test --packages-select tram_dr_localization \
            --event-handlers console_direct+
          colcon test-result --all --verbose

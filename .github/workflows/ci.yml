name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: plant / checker
        run: python tools/eval/test_eval.py
      - name: generator
        run: python tools/synth/test_generate.py
      - name: no GNSS in filter
        run: python tools/eval/no_gnss_scan.py

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cmake standalone core
        run: |
          cmake -S standalone -B standalone/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"
          cmake --build standalone/build --parallel
          ctest --test-dir standalone/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: synth e2e (generate -> replay_ukf -> envelope -> score)
        run: |
          python tools/synth/generate.py --out synth/runs
          python tools/eval/run_e2e.py --ukf standalone/build/replay_ukf
          python tools/synth/score.py --runs synth/runs

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # F-11: this job used to build test_core only, so the integrity
      # contracts and the UT weight algebra never ran under sanitizers.
      # The target list below is explicit, which means every new test target
      # must be added here as well - the Release job above picks new targets
      # up through ctest, this one does not.
      - name: sanitizers on all core test targets
        run: |
          cmake -S standalone -B standalone/build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build standalone/build-asan \
            --target test_core test_integrity_contracts test_ut_weights_psd \
                     test_ut_weights_header \
            --parallel
          export ASAN_OPTIONS=detect_leaks=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          ./standalone/build-asan/test_core
          ./standalone/build-asan/test_integrity_contracts
          ./standalone/build-asan/test_ut_weights_psd
          ./standalone/build-asan/test_ut_weights_header

  ros:
    # F-19: every job above builds standalone/ only. Until this job existed,
    # no ROS node in tram_dr_localization was ever compiled by CI and none of
    # the four ament_add_gtest suites ever ran. The node layer is where all
    # input-validation and timebase handling lives, so the entire class of
    # defect that F-17 / F-17b belong to was invisible to CI by construction.
    # Distro matches the Dockerfile (osrf/ros:humble-desktop).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: workspace and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          # Deliberately no apt-get here. ros:humble-ros-base already ships
          # build-essential, python3-colcon-common-extensions and
          # python3-rosdep, and its own Dockerfile has already run
          # `rosdep init`. Calling `apt-get update` would tie this package's
          # build to the ROS apt repository's signing key staying valid - an
          # unrelated external dependency that has expired before and that
          # reports itself as a failure of code it never compiled.
          command -v colcon
          command -v rosdep
          c++ --version
          mkdir -p /ws/src
          # Same layout the Dockerfile uses, so this job validates that too.
          cp -a "$GITHUB_WORKSPACE/tram_dr_localization" /ws/src/
          # rosdep is best-effort on purpose. This package depends only on
          # rclcpp, std_msgs, sensor_msgs, nav_msgs and ament_cmake_gtest, all
          # present in the base image, so an unreachable rosdep index must not
          # be reported as a compile failure. The colcon build below is the
          # authoritative check and stays strict.
          rosdep update --rosdistro "$ROS_DISTRO" \
            || echo "rosdep update unavailable, continuing on base image contents"
          rosdep install --from-paths /ws/src --ignore-src -y --rosdistro "$ROS_DISTRO" \
            || echo "rosdep install incomplete, continuing on base image contents"
      - name: colcon build (core library + all four nodes)
        shell: bash
        run: |
          set -euxo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cd /ws
          colcon build --packages-select tram_dr_localization \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"
      - name: colcon test (test_types, test_plant, test_sca, test_ukf)
        shell: bash
        run: |
          set -euxo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cd /ws
          colcon test --packages-select tram_dr_localization \
            --event-handlers console_direct+
          colcon test-result --all --verbose

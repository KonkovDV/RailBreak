name: rosbag-integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: install metadata parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: synthetic metadata integrity tests
        run: PYTHONPATH=tools/eval python tools/eval/test_audit_rosbag_integrity.py

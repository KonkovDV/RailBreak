# Stop-vertex polyline Щукинская → ул. Кулакова.
# Coordinates: OSM tram_stop, 2026-09-03, ODbL. Not a surveyed centreline,
# not GTFS. Replace from data.mos.ru / GTFS Мосгортранса when that file is in data/.
# Do not delete a vertex without GTFS. Do not cite length 5.5 км (old terminus
# at Таллинская, 2018). Chord length of this polyline is not the route length.
#
# ginfo (Щукинская → Кулакова, 9 остановок):
#   Метро Щукинская → Медицинский центр Бурназяна → Детская поликлиника →
#   [МОСТ] → Исаковского, 33 → Маршала Катукова → Метро Строгино →
#   Школа Марины Цветаевой → Таллинская, 6 → Кулакова.
# Обратно 8 остановок (без Бурназяна).
# OSM-порядок на щукинском берегу: Новощукинская, затем Бурназяна.
# ginfo-порядок: Бурназяна, затем Детская поликлиника (Новощукинская ул.).
# Координаты из OSM не переставлять по списку имён. «Детская поликлиника»
# может совпадать с OSM «Новощукинская улица» или быть отдельной точкой
# между Бурназяном и мостом — без GTFS не выдумывать вершину.
#
#   s=0.0 m     55.810004,37.461373  Метро «Щукинская» (OSM 944176912)
#   s=174.7 m   55.808538,37.460364  Новощукинская улица (OSM 4730763808)
#                                    ginfo: вероятно «Детская поликлиника»
#   s=408.4 m   55.806844,37.458153  Медицинский центр имени Бурназяна (OSM 711057604)
#   — перегон 408–2794 м ≈ 1.4–1.9 км (оценка): самый длинный, без ZUPT-якорей.
#     Содержит Строгинский мост (рамно-подвесной, 5 пролётов
#     32.9–81.0–128.5–81.0–34.3 м + эстакада ~212 м, всего 570 м;
#     Носарев/Скрябина 2004; не «арочный однопролётный 120 м»).
#     Русловая часть ~300 м полотна × 2 направления ремонтируется с июня 2026
#     (бесстык); эстакада и рампа, вероятно, вне работ.
#     mos.ru / АГН / Газета Метро 13–17.06.2026: движение по временной линии,
#     расписание штатное. Анонс Москвы 24 от 21.05 (отмена 10/15/21, автобусы)
#     превзойдён. Срок окончания не объявлен.
#     На 25.09 вероятна однопутка со стрелками по концам моста (вывод, не
#     документ): 5–15 км/ч на съездах, ZUPT у стрелки БЕЗ mass_door.
#     Проверка по bag: два замедления ω до ~3 м/с с интервалом ~300–350 м.
#     i(s) В НОДУ НЕ СТАВИТЬ. Оценка спуска в Строгино: центр 32 ‰, диапазон
#     25–40 ‰ (не факт) — только генератор (*route10*).
#     OSM bridge=yes / layer=1 — s-границы моста и эстакады, когда извлечём
#     way; не выдумывать метры. DEM на мосту/эстакаде не доверять (DSM).
#     h(s): profile_from_bag.py (z) или [F_bias↓−F_bias↑]/(2mg) оффлайн.
#   s=2794.0 m  55.804351,37.420237  Улица Исаковского, 33 (OSM 638922972)
#                                    после рампы, уровень поймы
#   s=3222.8 m  55.805250,37.413564  Улица Маршала Катукова (OSM 944656876)
#   s=3711.1 m  55.802060,37.408193  Метро «Строгино» (OSM 946193053)
#   s=4196.0 m  55.799240,37.402275  Школа имени Марины Цветаевой (OSM 5894578522)
#   s=4605.4 m  55.799361,37.395728  Таллинская улица, 6 (OSM 8299188700)
#   s=4832.3 m  55.800089,37.392337  Улица Кулакова (OSM 8299188701)
#
# Конечные: Метро Щукинская — Улица Кулакова. Депо: Краснопресненское.
# Щукинская → Кулакова: спуск в пойму на рампе (оценка 25–40 ‰); торможение
# к «Исаковского, 33» у подножия/на ровном. Обратно: разгон на подъём.
# При однопутке обе фазы — ползучий проход; служебное 60 км/ч на спуске —
# только synthetic.
# ZUPT якорит v, не s. mass_door_kg только если |s−stop|≤stop_gate_m.
# route_s_m в map_projector и state_estimator должны совпадать.
map_projector:
  ros__parameters:
    route_s_m: [0.0, 174.7, 408.4, 2794.0, 3222.8, 3711.1, 4196.0, 4605.4, 4832.3]
    route_lat_deg: [55.810004, 55.808538, 55.806844, 55.804351, 55.805250, 55.802060, 55.799240, 55.799361, 55.800089]
    route_lon_deg: [37.461373, 37.460364, 37.458153, 37.420237, 37.413564, 37.408193, 37.402275, 37.395728, 37.392337]

state_estimator:
  ros__parameters:
    # Stop s for mass_door gate only. Not i(s), not a measurement.
    route_s_m: [0.0, 174.7, 408.4, 2794.0, 3222.8, 3711.1, 4196.0, 4605.4, 4832.3]
    stop_gate_m: 40.0

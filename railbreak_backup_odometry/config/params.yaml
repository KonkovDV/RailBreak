backup_odometry:
  ros__parameters:
    # Empty: share/railbreak_backup_odometry/assets
    assets_dir: ""
    # GNSS is read from the first valid fix of either antenna for this many
    # seconds, then unsubscribed. A later master does not move that start.
    gnss_init_window_s: 3.0
    # No fix this long after the first input: publish relative odometry from the start point.
    gnss_wait_s: 10.0
    # Bogie and notch headers arrive out of stamp order across streams. The
    # watermark is the slowest live stream minus this hold. Samples are applied
    # in stamp order up to that watermark. There is no timer and no /clock.
    # Inside one stream the 122 recordings step back only twice by less than
    # 0.10 s, so the stream min needs no hold; 0.10 s cost about 150 ms of
    # input-to-output latency at --rate 1.
    stamp_reorder_s: 0.0
    # A stream this far behind the freshest is ORDER_NOT_RESTORED. It leaves the
    # watermark only after 50 other samples arrived without one from it. The watermark still will not pass that
    # stream's latest by more than this, while the lead is at most 5 s, so one
    # early stamp cannot skip the samples the other streams have not delivered.
    # A larger lead drops the cap. A late sample is counted
    # in n_behind_out if the output has already passed it. It is not dropped
    # inside the queue.
    order_stall_s: 1.0
    # Bogie field to m/s. Recordings are km/h (ratio to GNSS speed 3.6).
    wheel_unit_scale: 0.2777777777777778
    # /result/position axes. mgrs: UTM 37N minus the square corner
    # (300000 E, 6100000 N), absolute, x east, y north. The issued polylines
    # sit at x about 99–103 km, which is this corner, not 400000 (that one
    # puts Tallinskaya near −1 km). mkrs_start remains available.
    output_frame: mgrs
    mkrs_x_is_north: false
    utm_zone: 37
    mgrs_square_easting: 300000.0
    mgrs_square_northing: 6100000.0
    # Publish base_link: yaw axis of the first bogie, at the wheel-rail contact.
    # Antenna tf in that frame, y = 0: master (-9.873, 0, 3), rover (2.563, 0, 3).
    # Bogie pitch is not this offset.
    output_offset_along_m: 9.873
    output_offset_up_m: -3.0
    # Rover-only start: the snap is the rover. Step back to the master along
    # the ring, then the offset above reaches base_link. 9.873 + 2.563 = 12.436.
    rover_baseline_m: 12.436
    # No GNSS at the start. Leave unset (NaN): relative path. initial_lat_deg and
    # initial_lon_deg snap to the ring; initial_s_m is an arc length in metres.
    load_factor: 1.0
    # Both 0: do not scale k0 by a wheel radius. Bogie speed is already km/h.
    # k0 in meta.yaml is the train scale. 0.35 m is not a default here.
    wheel_radius_m: 0.0
    wheel_radius_nominal_m: 0.0
    # Extra resistance on top of the table, acceleration form A + B v + C v^2.
    # Zero: the identified table already contains it.
    davis_a: 0.0
    davis_b: 0.0
    davis_c: 0.0
    sigma_k0: 0.004
    q_v: 0.05
    q_s: 0.0001
    q_k: 1.0e-9
    q_ba: 1.0e-5
    nis_gate: 16.0
    fr_sigma_gate: 4.0
    fr_floor: 0.3
    zupt_v: 0.05
    zupt_hold_s: 1.0
    # 3*sqrt(R) at R=1 would be 3 m/s. The cap keeps a slow roll from looking parked.
    zupt_v_max: 0.5
    stop_gate: 3.0
    diagnostics_every_n: 20
    frame_id: map
    child_frame_id: base_link
